# Fly.io deployment config. Deploy with: fly launch --no-deploy && fly deploy
# Then set the shared secret: fly secrets set PROXY_SECRET=<random string>

app = "mozosubz-monnify-proxy"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
